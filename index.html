<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#050814" />
  <meta name="color-scheme" content="dark" />
  <title>Neon Forge: City of Tomorrow</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="cityfx.css" />
</head>
<body>
  <div id="bootOverlay"><div class="boot-core"><div class="boot-logo">NEON FORGE</div><div class="boot-bar"><i></i></div><div class="boot-sub">CITY NETWORK // ONLINE</div></div></div>
  <canvas id="fxCanvas" aria-hidden="true"></canvas>
  <div class="ambient-orbs" aria-hidden="true"><i></i><i></i><i></i></div>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="brandline"><div class="eyebrow">NEON FORGE</div><div class="live-pill">CITY ONLINE</div></div>
        <h1 id="title">City of Tomorrow</h1>
      </div>
      <div class="top-actions"><div id="audioState" class="audio-state">♫ LIVE</div><button id="langBtn" class="icon-btn" aria-label="Sprache">DE</button></div>
    </header>
    <section class="wallet card">
      <div><span data-i18n="credits">Credits</span><strong id="credits">0</strong></div>
      <div><span data-i18n="perSecond">/ Sek.</span><strong id="cps">0</strong></div>
      <div><span data-i18n="cores">Cores</span><strong id="cores">0</strong></div>
      <div><span data-i18n="chips">Event-Chips</span><strong id="chips">0</strong></div>
    </section>
    <main id="page" class="page"></main>
    <nav class="nav" aria-label="Hauptnavigation">
      <button data-page="city" class="active">🏙️<span data-i18n="city">Stadt</span></button>
      <button data-page="upgrades">⚙️<span data-i18n="upgrades">Upgrades</span></button>
      <button data-page="collection">◈<span data-i18n="collection">Sammlung</span></button>
      <button data-page="missions">◎<span data-i18n="missions">Missionen</span></button>
      <button data-page="more">☰<span data-i18n="more">Mehr</span></button>
    </nav>
  </div>
  <div id="modalRoot"></div>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
  <script src="enhancements.js"></script>
  <script src="cityfx.js"></script>
</body>
</html>
